rif" font-size="12" font-weight="400" fill="#17364a" text-anchor="middle">16 × 32²</text><path d="M313 239L313 262" stroke="#8295a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="277" y="273" width="72" height="38" rx="5" fill="#8364b4" stroke="#8364b4"/><text x="313" y="297" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">M4</text><rect x="360" y="175" width="72" height="60" rx="5" fill="#f6f9fb" stroke="#b36a25"/><text x="396" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b36a25" text-anchor="middle">L5</text><text x="396" y="220" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17364a" text-anchor="middle">16 × 32²</text><path d="M396 239L396 262" stroke="#8295a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="273" width="72" height="38" rx="5" fill="#b36a25" stroke="#b36a25"/><text x="396" y="297" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">M5</text><text x="230" y="338" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17364a" text-anchor="middle">Robot positions selected separately at each L</text><path d="M230 348L230 369" stroke="#8295a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="22" y="378" width="416" height="83" rx="9" fill="#f2f8f5" stroke="#a6ccba"/><text x="230" y="405" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17364a" text-anchor="middle">SQUARE → MEAN → SQRT</text><text x="230" y="431" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17364a" text-anchor="middle">D_L = √(Σ selected Δv² / (16 × n_L))</text><text x="230" y="450" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#17364a" text-anchor="middle">n_L = selected robot cells in this future slot</text><rect x="28" y="479" width="72" height="45" rx="5" fill="#187c64" stroke="#187c64"/><text x="64" y="508" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">D1</text><rect x="111" y="479" width="72" height="45" rx="5" fill="#148b98" stroke="#148b98"/><text x="147" y="508" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">D2</text><rect x="194" y="479" width="72" height="45" rx="5" fill="#367ac3" stroke="#367ac3"/><text x="230" y="508" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">D3</text><rect x="277" y="479" width="72" height="45" rx="5" fill="#8364b4" stroke="#8364b4"/><text x="313" y="508" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">D4</text><rect x="360" y="479" width="72" height="45" rx="5" fill="#b36a25" stroke="#b36a25"/><text x="396" y="508" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">D5</text><text x="230" y="547" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17364a" text-anchor="middle">5 RMS values → one for each future latent</text><path d="M230 554L230 575" stroke="#8295a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="230" y="598" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17364a" text-anchor="middle">Pooled RMS = √(Σ n_L D_L² / Σ n_L)</text><text x="230" y="626" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17364a" text-anchor="middle">1 scalar · weighted by selected cell counts</text></svg>